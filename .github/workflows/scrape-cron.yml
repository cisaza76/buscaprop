name: Scrape portales (cada 6h, 4 jobs paralelos)

# ─────────────────────────────────────────────────────────────────────────────
# 4 jobs paralelos, uno por portal. Mucho más rápido que serie:
#   - Wall clock: ~40 min (vs ~150 min en serie con maxListings=1500)
#   - Compute total: ~160 min (4 × 40 min) — cabe holgado en GH Actions free
#     para repos públicos. Para repos privados free tier es 2000 min/mes
#     → ~12 runs/mes con esta config (1 cada 2.5 días).
#
# Trigger:
#   - Schedule: cada 6h (4 runs/día = 16 runs/día compute = ~2400 min/día — solo OK
#     para repos públicos o GH Pro). Para free tier privado bajar a "0 0,12 * * *".
#   - Manual via UI: workflow_dispatch (control fino de portal/op/max)
#
# Por qué corremos en runner (no webhook a Vercel):
#   Los scrapers tardan 25-40 min con maxListings=1500. Vercel Hobby tiene
#   timeout 300s y Pro 800s — no caben. GitHub Actions runners no tienen
#   ese límite (timeout-minutes: 180 = 3h).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # Cada 6h en UTC. Para Colombia (UTC-5):
    # 00 UTC → 19h CO  ·  06 UTC → 01h CO  ·  12 UTC → 07h CO  ·  18 UTC → 13h CO
    - cron: '0 */6 * * *'

  workflow_dispatch:
    inputs:
      portal:
        description: 'Portal específico (vacío = todos en paralelo)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - fincaraiz
          - metrocuadrado
          - properati
          - ciencuadras
      op:
        description: 'Operación (vacío = venta+arriendo)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - venta
          - arriendo
      max:
        description: 'Máx propiedades por portal'
        required: false
        type: string
        default: '1500'

# Si llega un schedule mientras corre uno, encolar (no cancelar).
concurrency:
  group: scrape-cron-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  scrape:
    name: scrape-${{ matrix.portal }}
    runs-on: ubuntu-latest
    timeout-minutes: 90 # Cada portal tarda 25-50 min con maxListings=1500. Margen 2x.

    strategy:
      # Fail-fast false: si un portal falla, los demás siguen.
      fail-fast: false
      matrix:
        # Si workflow_dispatch pasó portal específico, solo ese.
        # Sino los 4 en paralelo. La condicional se evalúa por step abajo.
        portal:
          - fincaraiz
          - metrocuadrado
          - properati
          - ciencuadras

    steps:
      - name: Skip if specific portal requested and not this one
        id: skip-check
        run: |
          REQUESTED="${{ inputs.portal || '' }}"
          if [ -n "$REQUESTED" ] && [ "$REQUESTED" != "${{ matrix.portal }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping ${{ matrix.portal }} (requested: $REQUESTED)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.skip-check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.skip-check.outputs.skip != 'true'
        run: npm ci

      - name: Run scraper for ${{ matrix.portal }}
        if: steps.skip-check.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          MAX="${{ inputs.max || '1500' }}"
          OP="${{ inputs.op || '' }}"
          ARGS=(--portal "${{ matrix.portal }}" --max "$MAX")
          if [ -n "$OP" ]; then ARGS+=(--op "$OP"); fi
          echo "▶ npx tsx scripts/scrape-once.ts ${ARGS[*]}"
          npx tsx scripts/scrape-once.ts "${ARGS[@]}"

      - name: Summary
        if: always() && steps.skip-check.outputs.skip != 'true'
        run: |
          echo "### Scrape ${{ matrix.portal }} · $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Status: \`${{ job.status }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Op: \`${{ inputs.op || 'venta+arriendo' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Max: \`${{ inputs.max || '1500' }}\`" >> $GITHUB_STEP_SUMMARY
